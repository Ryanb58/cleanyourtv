plugins {
    id 'com.android.application'
}

android {
    namespace 'home.themes'
    compileSdk 34

    defaultConfig {
        applicationId 'home.themes'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    // Images are already compressed; storing them as-is keeps the build fast and lets the app stream them.
    androidResources {
        noCompress 'jpg', 'jpeg', 'png', 'webp'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
